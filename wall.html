<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArchieTV · Learning Arc</title>
<link rel="icon" href="/archie-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* ArchieTV (Aviv, 2026-11-01): one look for every screen. These tokens are the only colours and type on the TV:
   a screen never sets its own. Colour names a kind of thing, never good or bad, and there is no red. */
:root { color-scheme: dark;
  --tv-bg: #0c0a1d; --tv-ink: #efedff; --tv-mute: #a19dcc; --tv-line: rgba(255,255,255,.11); --tv-tile: rgba(255,255,255,.065);
  --violet: #8f82ff; --teal: #2fd6cc; --pink: #ff6fae; --orange: #ffa35f; --gold: #ffd36b;
  --display: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  /* type scale, in cqw of the 16:9 stage: nothing on the TV below --fs-min */
  --fs-min: 1.85cqw; --fs-label: 1.95cqw; --fs-name: 2.3cqw; --fs-sub: 2.5cqw; --fs-item: 3.2cqw; --fs-head: 6.4cqw; --fs-kpi: 8.4cqw; --fs-hero: 15cqw; --fs-huge: 17cqw;
  /* frame */
  --pad-top: 4cqw; --pad-side: 5cqw; --pad-bottom: 4.4cqw; --r-tile: 1.6cqw; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: var(--tv-bg); color: var(--tv-ink); overflow: hidden; }
body { display: grid; place-items: center; font-family: var(--display); -webkit-font-smoothing: antialiased; }

/* ---- Aviv's mock, part 5 ---- */
.tv { container-type: inline-size; aspect-ratio: 16 / 9; width: min(100vw, calc(100vh * 16 / 9)); background: var(--tv-bg); color: var(--tv-ink); overflow: hidden; position: relative; font-family: var(--display); font-variant-numeric: tabular-nums; }
.tv::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 70% at 8% 0%, rgba(91,75,219,.38), transparent 70%), radial-gradient(50% 60% at 100% 100%, rgba(47,214,204,.14), transparent 70%); pointer-events: none; }
.scr { position: absolute; inset: 0; padding: var(--pad-top) var(--pad-side) var(--pad-bottom); display: grid; grid-template-rows: auto 1fr; gap: 2.2cqw; }
.kick { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--fs-min); color: var(--tv-mute); text-transform: uppercase; letter-spacing: .14em; }
.kick b { color: var(--tv-ink); font-weight: 600; }
.big { font-size: var(--fs-head); font-weight: 800; line-height: .95; letter-spacing: -.045em; text-wrap: balance; }
.big em { font-style: normal; color: var(--teal); }
.sub { font-size: var(--fs-sub); color: var(--tv-mute); margin-top: 1.2cqw; line-height: 1.25; }
.two { display: grid; grid-template-columns: 1fr 1.3fr; gap: 4cqw; align-items: center; min-height: 0; }
.bar { height: 1.4cqw; border-radius: 1cqw; background: var(--tv-line); display: flex; overflow: hidden; margin-top: 2.4cqw; }
.bar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: .8cqw 2.4cqw; font-size: var(--fs-label); color: var(--tv-mute); margin-top: 1.2cqw; }
.legend span::before { content: ""; display: inline-block; width: 1.2cqw; height: 1.2cqw; border-radius: 50%; background: var(--k); margin-right: .7cqw; }
.items { display: grid; gap: 2.6cqw; margin: 0; padding: 0; list-style: none; }
.items li { display: grid; grid-template-columns: 1.5cqw minmax(0, 1fr); gap: 1.8cqw; align-items: start; font-size: var(--fs-item); line-height: 1.15; font-weight: 600; text-wrap: balance; }
.items li::before { content: ""; width: 1.5cqw; height: 1.5cqw; border-radius: 50%; background: var(--k); margin-top: 1cqw; }
.items li .who { display: block; color: var(--tv-mute); font-weight: 400; font-size: var(--fs-name); margin-top: .5cqw; }
.items li.more { color: var(--teal); font-weight: 600; font-size: 2.6cqw; }
.items li.more::before { content: "+"; background: none; width: auto; height: auto; font-size: 3cqw; line-height: 1; text-align: center; margin-top: 0; }
.trains { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2cqw; align-content: center; }
.tr { background: var(--tv-tile); border-radius: var(--r-tile); padding: 2.3cqw 2.4cqw; display: grid; gap: .7cqw; border-top: .6cqw solid var(--k); }
.tr .env { font-size: 1.9cqw; color: var(--tv-mute); text-transform: uppercase; letter-spacing: .12em; }
.tr .ver { font-size: 4.4cqw; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.tr .when { font-size: 1.9cqw; color: var(--tv-mute); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.6cqw; align-content: center; }
.kp { display: grid; gap: .6cqw; align-content: start; }
.kp .n { font-size: var(--fs-kpi); font-weight: 800; letter-spacing: -.05em; line-height: .9; color: var(--k); }
.kp .l { font-size: var(--fs-name); color: var(--tv-ink); line-height: 1.15; font-weight: 600; }
.kp .s { font-size: var(--fs-min); color: var(--tv-mute); line-height: 1.2; }
/* ---- Aviv's mock, part 6 ---- */
.fans { display: grid; grid-template-columns: 1.35fr 1fr; gap: 4cqw; align-items: end; min-height: 0; }
.pod { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6cqw; align-items: end; height: 100%; }
.st { display: grid; justify-items: center; gap: .8cqw; text-align: center; }
.st .md { font-size: 4cqw; line-height: 1; }
.st .nm { font-size: 3cqw; font-weight: 800; }
.st .blk { width: 100%; border-radius: 1.4cqw 1.4cqw 0 0; background: linear-gradient(180deg, var(--k), color-mix(in srgb, var(--k) 18%, transparent)); display: grid; place-items: start center; padding-top: 1.2cqw; font-size: 3.6cqw; font-weight: 800; color: var(--tv-bg); }
.side { display: grid; gap: 1.5cqw; align-content: end; }
.side .row { display: flex; justify-content: space-between; gap: 2cqw; font-size: 2.6cqw; border-bottom: 1px solid var(--tv-line); padding-bottom: 1cqw; }
.side .row b { font-weight: 800; }
.side .row span { color: var(--tv-mute); }
.side .tot { font-size: 2.1cqw; color: var(--teal); }
.growth { display: grid; grid-template-columns: .9fr 1.5fr; gap: 3.6cqw; align-items: center; min-height: 0; }
.growth svg { width: 100%; height: auto; display: block; overflow: visible; }
.ship { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2cqw 3.4cqw; align-content: center; }
.grp { display: grid; gap: .6cqw; border-left: .5cqw solid var(--k); padding-left: 1.8cqw; }
.grp .f { font-size: 2.9cqw; font-weight: 800; line-height: 1.1; }
.grp .x { font-size: 2cqw; color: var(--tv-mute); }
.party .scr { text-align: center; align-content: center; grid-template-rows: auto auto auto; gap: 2.4cqw; }
.party .kick { justify-content: center; }
.party::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(#ff6fae 0 0) 8% 14% / 1.4cqw .6cqw no-repeat, linear-gradient(#2fd6cc 0 0) 18% 80% / .7cqw 1.5cqw no-repeat, linear-gradient(#ffa35f 0 0) 30% 9% / 1.2cqw .6cqw no-repeat, linear-gradient(#8f82ff 0 0) 72% 12% / .6cqw 1.4cqw no-repeat, linear-gradient(#ff6fae 0 0) 88% 26% / 1.3cqw .6cqw no-repeat, linear-gradient(#2fd6cc 0 0) 93% 70% / 1.2cqw .6cqw no-repeat, linear-gradient(#ffd36b 0 0) 80% 88% / .6cqw 1.3cqw no-repeat, linear-gradient(#8f82ff 0 0) 6% 52% / .6cqw 1.3cqw no-repeat, linear-gradient(#ffd36b 0 0) 44% 91% / 1.3cqw .6cqw no-repeat, linear-gradient(#ff6fae 0 0) 62% 86% / .6cqw 1.2cqw no-repeat, linear-gradient(#2fd6cc 0 0) 52% 6% / .6cqw 1.2cqw no-repeat, linear-gradient(#ffd36b 0 0) 14% 30% / .6cqw 1.2cqw no-repeat; }
.party .huge { font-size: var(--fs-huge); font-weight: 800; line-height: .82; letter-spacing: -.06em; color: var(--gold); }
.party .title { font-size: 3.4cqw; line-height: 1.2; max-width: 74cqw; margin: 0 auto; color: var(--tv-mute); text-wrap: balance; }
.party .title b { color: var(--tv-ink); }
@keyframes rise { from { opacity: 0; transform: translateY(1.2cqw); } }
.tv > .scr { animation: rise .7s both; }
@media (prefers-reduced-motion: reduce) { .tv > .scr { animation: none; } }

/* ---- the frame's chrome: the ArchieTV mark and the loop's progress, in the bottom margin every screen shares ---- */
.scr > * { min-width: 0; overflow-wrap: break-word; }
.mark { position: absolute; z-index: 2; left: var(--pad-side); right: var(--pad-side); bottom: 1.2cqw; display: flex; justify-content: space-between; align-items: center; font-size: var(--fs-min); color: var(--tv-mute); pointer-events: none; }
.mark .brand { display: inline-flex; align-items: center; font-weight: 700; letter-spacing: -.02em; color: var(--tv-ink); }
.mark .brand b { font-weight: inherit; color: var(--violet); }
.mark .brand i { font-style: normal; font-size: .62em; font-weight: 800; letter-spacing: .06em; margin-left: .45cqw; padding: .15cqw .55cqw; border-radius: .45cqw; background: var(--violet); color: var(--tv-bg); }
.mark .for { margin-left: 1cqw; }
.loop { display: inline-flex; gap: .5cqw; pointer-events: auto; }
.loop i { cursor: pointer; position: relative; display: block; width: 2.2cqw; height: .35cqw; border-radius: .3cqw; background: var(--tv-line); overflow: hidden; }
.loop i b { position: absolute; inset: 0; width: 0; background: var(--violet); }
.loop i.on b { width: var(--p, 0%); }
.loop i.done b { width: 100%; opacity: .45; }
.tv video.clip { justify-self: center; align-self: center; max-width: 100%; max-height: 100%; min-height: 0; border-radius: 1.6cqw; background: #000; }
canvas#party { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
.gate { position: fixed; inset: 0; display: none; place-items: center; z-index: 9; background: var(--tv-bg); text-align: center; font-size: 2.5vw; color: var(--tv-mute); }
.gate b { display: block; color: var(--tv-ink); font-size: 3vw; margin-bottom: 1vw; }
</style>
</head>
<body>
<canvas id="party"></canvas>
<div class="tv" id="tv"><div class="scr" id="scr"></div>
  <div class="mark"><span><span class="brand"><b>Archie</b><i>TV</i></span><span class="for">for Learning Arc</span></span><span class="loop" id="loop"></span></div>
</div>
<div class="gate" id="gate"><div><b>Sign in once on this screen</b>Open archie.walkmernd.com, sign in, then come back to /wall.</div></div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TZ = 'Asia/Jerusalem';
const ilTime = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const ilDay = (t) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(t));
const fmt = (n) => Number(n || 0).toLocaleString('en-US');
const dayMonth = (d) => { const t = new Date(`${String(d).slice(0, 10)}T12:00:00Z`); return `${t.getUTCDate()} ${t.toLocaleDateString('en-US', { month: 'short', timeZone: 'UTC' })}`; };
const monthName = (ym) => new Date(`${ym}-15T12:00:00Z`).toLocaleDateString('en-US', { month: 'long', timeZone: 'UTC' });
const plural = (n, one, many = `${one}s`) => `${fmt(n)} ${n === 1 ? one : many}`;
const names = (list) => (list.length <= 2 ? list.join(' and ') : `${list.slice(0, 2).join(', ')} and ${list.length - 2} more`);

// ---------- the shared layouts (Aviv's mock, part 7: his renderScene, ported as renderTv) ----------
// A scene is data in one layout; every string goes through esc(). A new kind of screen is a new layout here, never one-off HTML.
const K = { teal: 'var(--teal)', violet: 'var(--violet)', pink: 'var(--pink)', orange: 'var(--orange)', gold: 'var(--gold)' };
const ROT = ['teal', 'violet', 'pink', 'orange', 'gold'];
const col = (c, i) => K[c] || K[ROT[i % ROT.length]];
// frame: kicker row + body; celebrate has no frame row
const kick = (s) => `<div class="kick"><span><b>${esc(s.kicker)}</b>${s.context ? ` · ${esc(s.context)}` : ''}</span><span>${s.dots ? dots(s.dots) : esc(s.asOf ? `as of ${s.asOf}` : s.window || '')}</span></div>`;
const dots = ({ index, of }) => Array.from({ length: of }, (_, i) => `<i style="display:inline-block;width:${i + 1 === index ? 3 : 1.2}cqw;height:1.2cqw;border-radius:1cqw;background:${i + 1 === index ? 'var(--teal)' : 'var(--tv-line)'};margin-right:.8cqw"></i>`).join('');
const list = (s) => `<ul class="items">${(s.items || []).map((t, i) => `<li style="--k:${col(t.color, i)}"><span>${esc(t.text)}${t.who ? `<span class="who">for ${esc(t.who)}</span>` : ''}</span></li>`).join('')}${s.more ? `<li class="more"><span>${esc(s.more)}</span></li>` : ''}</ul>`;
const lede = (s) => `<div><div class="big">${esc(s.title)}${s.em ? ` <em>${esc(s.em)}</em>` : ''}</div>${s.line ? `<div class="sub">${esc(s.line)}</div>` : ''}</div>`;
const R = {
  video: (s) => `<video class="clip" src="${esc(s.src)}" muted loop playsinline autoplay></video>`,
  kpis: (s) => `<div style="display:grid;gap:3cqw;align-content:center"><div class="big" style="font-size:4.6cqw">${esc(s.title)}</div><div class="kpis">${s.kpis.map((k, i) => `<div class="kp" style="--k:${col(k.color, i)}"><span class="n">${esc(k.value)}</span><span class="l">${esc(k.label)}</span>${k.note ? `<span class="s">${esc(k.note)}</span>` : ''}</div>`).join('')}</div></div>`,
  bars: (s) => {
    const max = Math.max(...s.series.map((p) => p.value)), W = 400, H = 200, n = s.series.length, gap = W / n, bw = gap * .68;
    const g = s.series.map((p, i) => { const h = Math.max(3, p.value / max * H), x = i * gap + (gap - bw) / 2, hi = i >= n - (s.highlightLast || 0); return `<rect x="${x}" y="${H - h}" width="${bw}" height="${h}" rx="4" fill="${hi ? '#2fd6cc' : '#8f82ff'}" opacity="${hi ? 1 : .45 + .5 * p.value / max}"/><text x="${x + bw / 2}" y="${H - h - 7}" ${hi ? 'fill="#efedff" font-weight="700"' : ''}>${esc(p.value)}</text><text x="${x + bw / 2}" y="${H + 20}">${esc(p.label)}</text>`; }).join('');
    return `<div class="growth"><div><div class="big">${esc(s.title)}</div>${s.line ? `<div class="sub">${esc(s.line)}</div>` : ''}</div><svg viewBox="0 -16 ${W} ${H + 46}"><g font-family="Bricolage Grotesque, sans-serif" font-size="13" fill="#a19dcc" text-anchor="middle"><line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="rgba(255,255,255,.15)"/>${g}</g></svg></div>`;
  },
  podium: (s) => {
    const top = s.ranks.slice(0, 3), rest = s.ranks.slice(3, 6), max = top[0].value, md = ['🥇', '🥈', '🥉'], kc = ['teal', 'violet', 'pink'];
    return `<div class="fans"><div class="pod">${[1, 0, 2].filter((i) => top[i]).map((i) => `<div class="st" style="--k:${K[kc[i]]}"><span class="md">${md[i]}</span><span class="nm">${esc(top[i].name)}</span><div class="blk" style="height:${10 + 14 * top[i].value / max}cqw">${esc(top[i].value)}</div></div>`).join('')}</div><div class="side">${rest.map((r, k) => `<div class="row"><span>${k + 4} · ${esc(r.name)}</span><b>${esc(r.value)}</b></div>`).join('')}${s.line ? `<div class="tot">${esc(s.line)}</div>` : ''}</div></div>`;
  },
  progress: (s) => {
    const tot = s.parts.reduce((n, p) => n + p.value, 0);
    return `<div class="two"><div><div class="big">${esc(s.title)}</div>${s.line ? `<div class="sub">${esc(s.line)}</div>` : ''}<div class="bar">${s.parts.map((p, i) => `<i style="width:${p.value / tot * 100}%;background:${col(p.color, i)}"></i>`).join('')}</div><div class="legend">${s.parts.map((p, i) => `<span style="--k:${col(p.color, i)}">${esc(p.value)} ${esc(p.label)}</span>`).join('')}</div></div>${list(s)}</div>`;
  },
  tiles: (s) => `<div class="trains" style="grid-template-columns:repeat(${s.tiles.length <= 4 ? s.tiles.length : 3}, 1fr)">${s.tiles.map((t, i) => `<div class="tr" style="--k:${col(t.color, i)}"><span class="env">${esc(t.label)}</span><span class="ver">${esc(t.value)}</span>${t.note ? `<span class="when">${esc(t.note)}</span>` : ''}</div>`).join('')}</div>`,
  feed: (s) => `<div class="two"><div><div class="big" style="font-size:15cqw;line-height:.85"><em>${esc(s.value)}</em></div><div class="sub" style="font-size:2.9cqw">${esc(s.title)}</div></div>${list(s)}</div>`,
  // title may hold one teal word: send {title:"Translate with", em:"AI"}
  highlight: (s) => `<div class="two">${lede(s)}${list(s)}</div>`,
  groups: (s) => `<div class="ship">${s.groups.slice(0, 6).map((g, i) => `<div class="grp" style="--k:${col(g.color, i)}"><span class="f">${esc(g.name)}</span>${g.note ? `<span class="x">${esc(g.note)}</span>` : ''}</div>`).join('')}</div>`,
  celebrate: (s) => `<div class="kick" style="justify-content:center"><b>${esc(s.kicker)}</b></div>${s.value ? `<div class="huge">${esc(s.value)}</div>` : `<div class="big" style="font-size:9cqw">${esc(s.title)}${s.em ? ` <em>${esc(s.em)}</em>` : ''}</div>`}<div class="title">${s.value ? `<b>${esc(s.title)}</b> ` : ''}${esc(s.line || '')}</div>`,
  // The four layouts Archie already publishes through lib/tv.js, drawn with the same pieces. Their items are strings.
  number: (s) => R.feed({ value: s.value, title: [s.title, s.line].filter(Boolean).join(' · '), items: [] }),
  list: (s) => R.highlight({ ...s, items: (s.items || []).slice(0, 3).map((t) => (typeof t === 'string' ? { text: t } : t)), more: s.more || ((s.items || []).length > 3 ? `And ${s.items.length - 3} more` : '') }),
  banner: (s) => `<div style="align-self:center;max-width:78cqw">${lede(s)}</div>`,
  moment: (s) => `<div style="align-self:center;max-width:70cqw"><div class="big" style="font-size:5.2cqw">${esc(s.title)}${s.em ? ` <em>${esc(s.em)}</em>` : ''}</div>${s.line ? `<div class="sub">${esc(s.line)}</div>` : ''}</div>`,
};
/** One scene's markup: the frame (kicker row) and its layout's body. A celebration is centred and carries its own kicker. */
function renderTv(s) {
  const party = s.layout === 'celebrate';
  return { party, html: party ? R.celebrate(s) : kick(s) + R[s.layout](s) };
}

// ---------- success first ----------
// Aviv's rule 0, the client's own check: a scene whose visible text carries a failure word never reaches the TV.
const FAILURE = /\b(errors?|fail(s|ed|ing|ures?)?|broken|broke|bugs?|incidents?|outages?|late|overdue|stuck|blocked|blocking|blockers?|waiting|down|red|crash(es|ed)?|(?<!drag[ -](and|&|n)[ -])drop(s|ped)?)\b/i;
const okText = (t) => !FAILURE.test(String(t || ''));
const visibleText = (s) => { const d = document.createElement('div'); d.innerHTML = renderTv(s).html; return d.textContent; };
function passes(s) {
  if (!s || !R[s.layout]) return false;
  try { return okText(visibleText(s)); } catch { return false; } // a scene missing its data does not render, so it does not play
}

// ---------- the screens: each one is data in, a scene out, or null when its data is not there ----------
// An MR title in plain words: no ticket keys in front, a capital first letter.
const plain = (t) => String(t || '').replace(/^\s*\[[^\]]*\]\s*/, '').replace(/^(\s*[A-Z][A-Z\d]+-\d+[\s,:]*)+/, '').replace(/^./, (c) => c.toUpperCase()).trim();
const noKeys = (t) => String(t || '').replace(/\b[A-Z][A-Z\d]+-\d+\b[\s,:]*/g, '').replace(/:\s*([a-z])/, (m, c) => `: ${c.toUpperCase()}`).trim();
const keyOf = (m) => m.key || (String(m.title || '').match(/\b[A-Z][A-Z\d]+-\d+\b/) || [])[0] || null;
const asOfAt = (w) => ilTime.format(new Date((w && w.at) || (SNAP && SNAP.at) || Date.now()));
const thisMonth = (w) => ilDay((w && w.at) || Date.now()).slice(0, 7);
const today = (w) => ilDay((w && w.at) || Date.now());
const forOf = (w) => { const by = new Map(((w.mrs && w.mrs.week) || []).map((m) => [m.ref, m.for])); return (m) => m.for || by.get(m.ref) || null; };
// Up to n list lines that pass the check, shortest-enough first so three fit, latest first among those.
function pickLines(rows, n = 3, max = 64) {
  const ok = rows.filter((r) => r.text && okText(r.text) && okText(r.who));
  const short = ok.filter((r) => r.text.length <= max);
  return [...short, ...ok.filter((r) => !short.includes(r))].slice(0, n);
}

function sceneToday(w) {
  const ms = (w.mrs && w.mrs.merged) || [];
  if (!ms.length) return null;

const relName = (t) => `${dayMonth(t.date)} release`;

// What reached customers this month, or last month when this one has none yet.
function sceneLive(w) {

// The team's merges this week, grouped by ticket: the box's groups when it sends them, else grouped here.
function sceneShipped(w) {

function sceneNumbers(w) {

// Who talked to Archie most today (Aviv, 2026-11-01): the asks each person sent, not the MRs merged for them.
function sceneTalk(w) {

// Celebrations jump into the loop with confetti: firsts, a record day, milestones, a release that reached Prod today, and Archie's "now" scenes.
const MERGED_MARKS = (n) => { const out = [350, 400, 500]; for (let m = 750; m <= n + 250; m += 250) out.push(m); return out; };
function celebrations(w) {

const SCREENS = [['today', 20, sceneToday], ['highlight', 12, sceneHighlight], ['live', 12, sceneLive], ['shipped', 12, sceneShipped], ['numbers', 12, sceneNumbers], ['growth', 12, sceneGrowth], ['talk', 12, sceneTalk], ['video', 15, sceneVideo]];

// ---------- drawing a scene ----------
const moreLine = (s, shown) => (s.more != null && !s.total ? s.more : s.total > shown ? `And ${fmt(s.total - shown)} more${s.moreWhat ? ` ${s.moreWhat}` : ''}` : '');
// Text wraps, never cuts: a screen whose words do not fit shows one list line fewer and counts it in "And N more".
function draw(sc) {
  const s = { ...sc, items: sc.items ? [...sc.items] : sc.items, groups: sc.groups ? [...sc.groups] : sc.groups };
  const scr = $('scr'), tv = $('tv');
  for (;;) {
    if (s.items && s.total) s.more = moreLine(s, s.items.length);
    const { party, html } = renderTv(s);
    tv.classList.toggle('party', party);
    scr.innerHTML = html;
    scr.style.animation = 'none'; void scr.offsetWidth; scr.style.animation = '';

function burst() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || new URLSearchParams(location.search).get('still')) return;

  c.width = innerWidth; c.height = innerHeight;
  const css = getComputedStyle(document.documentElement), colors = ROT.map((k) => css.getPropertyValue(`--${k}`).trim());

}

// ---------- the rotation ----------
// It runs on the wall clock, so every screen in the office shows the same scene at the same moment. ?scene=<name> pins one.
const PIN = new URLSearchParams(location.search).get('scene');
let WALL = null, PLAN = [], shown = null, SKIP = 0;
function at() {
  const list = PLAN, total = list.reduce((n, x) => n + x.s, 0) || 1;

  while (i < list.length - 1 && t >= list[i].s) { t -= list[i].s; i += 1; }

}
function rotate() {
  if (!WALL || !PLAN.length) return;

  const key = `${entry.name}:${entry.name === 'highlight' ? loop : ''}:${WALL.at || ''}`;

document.addEventListener('click', (e) => {

});
document.addEventListener('keydown', (e) => {

// ---------- data ----------
// The public copy (viewer/lib/wall-public.js) carries its numbers and never calls the box; the box's /wall polls its API.
let SNAP = window.WALL_SNAPSHOT || null;

let RELOAD_AT = SNAP ? Math.max(Date.now() + 60000, Date.parse(SNAP.at) + SNAP.every + 120000) : Date.now() + 4 * 3600 * 1000;
async function poll() {
  if (SNAP) { render({ at: SNAP.at, ...SNAP.data }); document.fonts.ready.then(() => { shown = null; rotate(); }); return; }
  try {
    const r = await fetch(`/api/wall${location.search}`, { credentials: 'same-origin' });

    $('gate').style.display = 'none';

// The public copy asks GitHub for snapshot.json each minute. New numbers render in place, with no reload.

async function pollSnapshot() {

}
poll(); if (!SNAP) setInterval(poll, 15000); else setInterval(pollSnapshot, 60000); setInterval(rotate, 1000);
// A TV runs for days: reload every few hours so a new deploy of this page reaches it.

setInterval(() => { if (Date.now() >= RELOAD_AT) (SNAP ? quietReload() : location.reload()); }, 15000);
